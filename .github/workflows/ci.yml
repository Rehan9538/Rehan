name: CI/CD Pipeline - BMS Diagnostic Engine

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  CMAKE_VERSION: "3.27"
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_PARALLEL_LEVEL: 2
  COVERAGE_THRESHOLD: 80

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC Debug"
            cc: "gcc"
            cxx: "g++"
            build_type: "Debug"
          - name: "GCC Release"
            cc: "gcc"
            cxx: "g++"
            build_type: "Release"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcunit1 \
            libcunit1-dev \
            cppcheck \
            clang-format \
            lcov \
            git

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        run: |
          cd build
          cmake -DCMAKE_C_COMPILER=${{ matrix.cc }} \
                 -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
                 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                 -DENABLE_TESTS=ON \
                 -DENABLE_CODE_COVERAGE=ON \
                 ..

      - name: Build project
        run: |
          cd build
          cmake --build . --config ${{ matrix.build_type }} -j$(nproc)

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure -V

      - name: Generate test report
        if: always()
        run: |
          cd build
          ctest --output-on-failure -V --timeout 300 > test_report.txt 2>&1 || true
          cat test_report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-report-${{ matrix.cc }}-${{ matrix.build_type }}
          path: build/test_report.txt

  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install linting tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cppcheck \
            clang-format \
            clang-tidy

      - name: Run cppcheck (Static Analysis)
        continue-on-error: true
        run: |
          echo "=== Running cppcheck ==="
          cppcheck --enable=all --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            src/ \
            include/ \
            tests/ \
            || true
          echo "cppcheck completed"

      - name: Check code formatting (clang-format)
        continue-on-error: true
        run: |
          echo "=== Checking code formatting ==="
          find src include tests -name "*.c" -o -name "*.h" | while read file; do
            if ! clang-format --dry-run -Werror "$file" 2>/dev/null; then
              echo "FORMATTING ISSUE: $file"
              clang-format "$file" > "${file}.formatted"
              diff -u "$file" "${file}.formatted" || true
              rm "${file}.formatted"
            fi
          done
          echo "Format check completed"

      - name: Run clang-tidy (Linting)
        continue-on-error: true
        run: |
          echo "=== Running clang-tidy ==="
          find src -name "*.c" | while read file; do
            echo "Analyzing: $file"
            clang-tidy "$file" -- -Iinclude 2>/dev/null || true
          done
          echo "clang-tidy completed"

  code-coverage:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libcunit1 \
            libcunit1-dev \
            lcov \
            gcc \
            gcov

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake with coverage
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Debug \
                 -DENABLE_TESTS=ON \
                 -DENABLE_CODE_COVERAGE=ON \
                 -DCMAKE_C_FLAGS="-O0 -g --coverage -fprofile-arcs -ftest-coverage" \
                 -DCMAKE_C_LINK_FLAGS="--coverage" \
                 ..

      - name: Build project
        run: |
          cd build
          cmake --build . -j$(nproc)

      - name: Run tests with coverage
        run: |
          cd build
          ctest --output-on-failure -V

      - name: Generate coverage report
        run: |
          cd build
          echo "=== Generating coverage data ==="
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage_filtered.info
          echo "=== Coverage Summary ==="
          lcov --list coverage_filtered.info

      - name: Extract coverage percentage
        id: coverage_calc
        run: |
          cd build
          COVERAGE=$(lcov --list coverage_filtered.info | tail -1 | awk '{print $2}' | sed 's/%//')
          echo "coverage_percent=$COVERAGE" >> $GITHUB_OUTPUT
          echo "📊 Code Coverage: ${COVERAGE}%"

      - name: Check coverage threshold
        run: |
          cd build
          COVERAGE=$(lcov --list coverage_filtered.info | tail -1 | awk '{print $2}' | sed 's/%//')
          THRESHOLD=${{ env.COVERAGE_THRESHOLD }}
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${THRESHOLD}%"
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ FAIL: Coverage (${COVERAGE}%) is below threshold (${THRESHOLD}%)"
            exit 1
          else
            echo "✅ PASS: Coverage (${COVERAGE}%) meets threshold (${THRESHOLD}%)"
          fi

      - name: Generate HTML coverage report
        run: |
          cd build
          genhtml coverage_filtered.info --output-directory coverage_report --quiet
          echo "✅ HTML report generated in coverage_report/"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./build/coverage_filtered.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: build/coverage_report/
          retention-days: 30

      - name: Create coverage summary
        if: always()
        run: |
          echo "# 📊 Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage: ${{ steps.coverage_calc.outputs.coverage_percent }}%**" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold: ${{ env.COVERAGE_THRESHOLD }}%**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ [View detailed HTML report](coverage-report/index.html)" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install security tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cppcheck

      - name: Run security checks
        continue-on-error: true
        run: |
          echo "=== Running security checks with cppcheck ==="
          cppcheck --enable=security,warning --error-exitcode=0 \
            --suppress=missingIncludeSystem \
            src/ include/ tests/ 2>&1 | tee security_report.txt

      - name: Upload security report
        uses: actions/upload-artifact@v3
        with:
          name: security-report
          path: security_report.txt

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, code-coverage, security-scan]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        if: always()
        uses: actions/download-artifact@v3
        continue-on-error: true

      - name: Generate comprehensive summary
        run: |
          echo "# 🚀 CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ PASSED' || '⚠️ WARNING' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Coverage | ${{ needs.code-coverage.result == 'success' && '✅ PASSED' || '❌ FAILED' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ PASSED' || '⚠️ WARNING' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 **Coverage Report** — View detailed code coverage metrics" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 **Test Reports** — GCC Debug & Release test results" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 **Security Report** — Static analysis findings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Requirements" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All unit tests passing" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code coverage > 80%" >> $GITHUB_STEP_SUMMARY
          echo "✅ No critical security issues" >> $GITHUB_STEP_SUMMARY
          echo "✅ Code formatted correctly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Build Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Print summary
        run: |
          echo "=========================================="
          echo "✅ CI/CD Pipeline Summary"
          echo "=========================================="
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Code Quality: ${{ needs.code-quality.result }}"
          echo "Code Coverage: ${{ needs.code-coverage.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "=========================================="

      - name: Fail if critical jobs failed
        if: |
          needs.build-and-test.result == 'failure' ||
          needs.code-coverage.result == 'failure'
        run: |
          echo "❌ Critical pipeline jobs failed!"
          exit 1

      - name: Success notification
        if: |
          needs.build-and-test.result == 'success' &&
          needs.code-coverage.result == 'success'
        run: |
          echo "✅ All critical checks passed successfully!"
          echo "🎉 Ready for merge!"
